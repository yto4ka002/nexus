<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16161C" />
      <stop offset="70%" stop-color="#0B0B0E" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>

    <!-- Violet Glow Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B6CFF" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6CFF" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" stroke="#25252D" stroke-width="12" />

  <!-- Outer Ring Accent -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#25252D" stroke-width="6" opacity="0.4" />

  <!-- Outer Ambient Violet Glow behind Emblem -->
  <circle cx="512" cy="512" r="180" fill="#8B6CFF" opacity="0.15" filter="url(#glow)" />

  <!-- NEXUS Infinity-Node Core Glyph -->
  <!-- Upper Left Loop -->
  <path d="M420 370 C340 370 280 430 280 512 C280 594 340 654 420 654 C480 654 524 606 564 554 L604 502 C644 450 688 402 748 402 C828 402 888 462 888 544"
        fill="none" stroke="url(#violetGrad)" stroke-width="56" stroke-linecap="round" />

  <!-- Interlocking Opposite Loop -->
  <path d="M604 654 C684 654 744 594 744 512 C744 430 684 370 604 370 C544 370 500 418 460 470 L420 522 C380 574 336 622 276 622 C196 622 136 562 136 480"
        fill="none" stroke="url(#accentGrad)" stroke-width="56" stroke-linecap="round" opacity="0.9" />

  <!-- Central Core Dots (Nexus Nodes) -->
  <circle cx="380" cy="512" r="36" fill="#8B6CFF" />
  <circle cx="380" cy="512" r="16" fill="#F1F1F5" />

  <circle cx="644" cy="512" r="36" fill="#A78BFA" />
  <circle cx="644" cy="512" r="16" fill="#0B0B0E" />

  <!-- Center Cross Connection Node -->
  <circle cx="512" cy="512" r="22" fill="#FFFFFF" filter="url(#glow)" />
</svg>
